<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>メンスト・アタック 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#0b1220; --surface:#121a2b; --line:#27324b; --ink:#eef2fa; --muted:#8a97b3;
  --accent:#6c9bff; --gold:#f2b84b; --bad:#ff6b6b;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-weight:900;font-size:24px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#081024;font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.danger.armed{background:var(--bad);color:#200;font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--muted)}
.msg.err{color:var(--bad)}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:2.6em 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.row .r{font-family:var(--mono);color:var(--muted);font-size:12px}
.row .info{min-width:0}
.row .n{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row.banned .n{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="bar">
    <div><div class="label">Admin</div><h1>ランキング管理</h1></div>
    <div id="who" class="msg"></div>
  </div>
  <div id="signedOut">
    <p class="msg">管理者の Google アカウントでログインしてください。</p>
    <button class="primary" id="loginBtn" type="button">Google でログイン</button>
  </div>
  <div id="denied" hidden>
    <p class="msg err">このアカウントには管理権限がありません。</p>
    <button id="logoutBtn2" type="button">ログアウト</button>
  </div>
  <section id="panel" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="msg">「削除」はランキングから消すだけです。同じ人がもう一度遊ぶとまた載ります。「削除してブロック」はその人をランキングに載せられなくします。ボタンは2回押すと実行されます。</p>
    <input type="search" id="filter" placeholder="ニックネームで絞り込み" aria-label="ニックネームで絞り込み">
    <div class="msg" id="status">読み込み中…</div>
    <div class="list" id="list"></div>
    <div class="bar"><span class="label">ブロック中</span></div>
    <div class="list" id="bannedList"></div>
    <div><button id="logoutBtn" type="button">ログアウト</button></div>
  </section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, query, orderBy, limit, onSnapshot, deleteDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDvKw0HbEaETph3cRQMDuexiwXAzdTvak8",
  authDomain: "mensto-attack-d1f7b.firebaseapp.com",
  projectId: "mensto-attack-d1f7b",
  storageBucket: "mensto-attack-d1f7b.firebasestorage.app",
  messagingSenderId: "869092534715",
  appId: "1:869092534715:web:2a0b3dc8ae98784ec33c9e"
};

const ADMIN_EMAIL = "tabcghh@gmail.com";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let rows = [], banned = [], unsubs = [];

$('loginBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
$('logoutBtn').onclick = $('logoutBtn2').onclick = () => signOut(auth);
$('filter').oninput = render;

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  const isAdmin = u && !u.isAnonymous && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  $('signedOut').hidden = !!(u && !u.isAnonymous);
  $('denied').hidden = !(u && !u.isAnonymous && !isAdmin);
  $('panel').hidden = !isAdmin;
  $('who').textContent = u && !u.isAnonymous ? u.email : '';
  if (!isAdmin) return;
  unsubs.push(onSnapshot(query(collection(db, 'scores'), orderBy('score','desc'), limit(500)), snap => {
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('status').textContent = `${rows.length} 件（上位500件まで表示）`;
    render();
  }, e => { $('status').textContent = '読み込めませんでした：' + e.message; $('status').className = 'msg err'; }));
  unsubs.push(onSnapshot(collection(db, 'banned'), snap => {
    banned = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderBanned();
  }));
});

function fmt(ts){
  try { const d = ts?.toDate ? ts.toDate() : null; return d ? d.toLocaleString('ja-JP') : ''; } catch(e){ return ''; }
}

// 2回押しで実行するボタン
function twoStep(label, armedLabel, cls, action){
  const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label;
  let t = null;
  b.onclick = async () => {
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = armedLabel;
      t = setTimeout(() => { b.classList.remove('armed'); b.textContent = label; }, 3000);
      return;
    }
    clearTimeout(t); b.disabled = true; b.textContent = '処理中…';
    try { await action(); } catch(e) { b.disabled = false; b.classList.remove('armed'); b.textContent = label; $('status').textContent = '失敗しました：' + e.message; }
  };
  return b;
}

function render(){
  const q = $('filter').value.trim().toLowerCase();
  const list = $('list'); list.textContent = '';
  rows.forEach((r, i) => {
    if (q && !(r.name || '').toLowerCase().includes(q)) return;
    const row = document.createElement('div'); row.className = 'row';
    const rank = document.createElement('span'); rank.className = 'r'; rank.textContent = i + 1;
    const info = document.createElement('div'); info.className = 'info';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = r.name || '(名前なし)';
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = `${(r.score||0).toLocaleString()} 点 ・ ${fmt(r.at)} ・ ${r.id.slice(0,8)}`;
    info.append(n, m);
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.append(
      twoStep('削除', 'もう一度で削除', 'danger', () => deleteDoc(doc(db, 'scores', r.id))),
      twoStep('削除してブロック', 'もう一度で実行', 'danger', async () => {
        await setDoc(doc(db, 'banned', r.id), { name: r.name || '', at: serverTimestamp() });
        await deleteDoc(doc(db, 'scores', r.id));
      })
    );
    row.append(rank, info, acts); list.appendChild(row);
  });
  if (!list.children.length) { const d = document.createElement('p'); d.className = 'msg'; d.textContent = '該当なし'; list.appendChild(d); }
}

function renderBanned(){
  const list = $('bannedList'); list.textContent = '';
  if (!banned.length) { const d = document.createElement('p'); d.className = 'msg'; d.textContent = 'ブロック中の人はいません'; list.appendChild(d); return; }
  banned.forEach(b => {
    const row = document.createElement('div'); row.className = 'row banned';
    const r = document.createElement('span'); r.className = 'r'; r.textContent = '—';
    const info = document.createElement('div'); info.className = 'info';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = b.name || '(名前なし)';
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = `${fmt(b.at)} ・ ${b.id.slice(0,8)}`;
    info.append(n, m);
    const acts = document.createElement('div'); acts.className = 'acts';
    const un = document.createElement('button'); un.type = 'button'; un.textContent = 'ブロック解除';
    un.onclick = () => deleteDoc(doc(db, 'banned', b.id));
    acts.append(un);
    row.append(r, info, acts); list.appendChild(row);
  });
}
</script>
</body>
</html>
